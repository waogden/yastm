name: Build YASTM (Skyrim 1.7.x)

on:
  push:
  workflow_dispatch:

env:
  # Current vcpkg tool; library versions are pinned to 2023 (fmt 9.1, spdlog 1.11)
  # by "builtin-baseline" in vcpkg.json. A 2023 vcpkg checkout no longer works:
  # its 7-Zip download URL is gone (404).
  VCPKG_TAG: 2026.10.16
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Keep LF endings so the CommonLib patch applies cleanly.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch CommonLibSSE_AE2 (Address Library format 5)
        run: git -C extern/CommonLibSSE_AE2 apply --verbose ../../patches/commonlib-ae2-addresslib-v5.patch

      - name: Set up vcpkg
        run: |
          # Full clone (not shallow): builtin-baseline needs the 2023 commit in history.
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout $env:VCPKG_TAG
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143
          -DSKYRIM_VERSION=AE2
          -DSKSE_SUPPORT_XBYAK=ON
          -DCOPY_BUILD=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Stage mod folder
        run: |
          New-Item -ItemType Directory -Force out/SKSE/Plugins | Out-Null
          Copy-Item build/RelWithDebInfo/YASTM.dll out/SKSE/Plugins/
          Copy-Item build/RelWithDebInfo/YASTM.pdb out/SKSE/Plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: yastm
          path: out/
